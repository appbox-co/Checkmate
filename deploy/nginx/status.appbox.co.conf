# Public Appbox status page. The Checkmate admin remains on the SSH tunnel.
proxy_cache_path /var/cache/nginx/checkmate-status levels=1:2 keys_zone=checkmate_status:4m max_size=64m inactive=1h use_temp_path=off;

map $arg_range $checkmate_status_range {
    default invalid;
    "" latest;
    latest latest;
    30d 30d;
    60d 60d;
    90d 90d;
}

# Validate detail selection before constructing upstream queries or cache keys.
map $arg_monitorId $checkmate_monitor_query {
    default invalid;
    "" "";
    "~^[0-9a-fA-F]{24}$" "&monitorId=$arg_monitorId";
}
map $arg_incidentPage $checkmate_incident_page {
    default invalid;
    "" 0;
    "~^(0|[1-9][0-9]{0,2}|1000)$" $arg_incidentPage;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name status.appbox.co;
    return 308 https://status.appbox.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.appbox.co;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/status.appbox.co.pem;
    ssl_certificate_key /etc/nginx/ssl/status.appbox.co.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:checkmate_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/checkmate-status.access.log;
    error_log /var/log/nginx/checkmate-status.error.log;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    proxy_http_version 1.1;
    proxy_set_header Host status.appbox.co;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Share public reads for one second; visitors must not share the upstream
    # app's 600/minute IP limit. Do not cache failures or serve stale outages.
    proxy_cache checkmate_status;
    proxy_cache_key "$host:$uri";
    proxy_cache_lock on;
    proxy_cache_valid 200 1s;
    proxy_ignore_headers Cache-Control Expires;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "no-store" always;

    location = / {
        proxy_pass http://127.0.0.1:52345/status/public/appbox;
    }

    location ~ "^/monitors/[0-9a-fA-F]{24}$" {
        proxy_pass http://127.0.0.1:52345;
    }

    location = /config.js {
        default_type application/javascript;
        return 200 'window.__CHECKMATE_CONFIG__ = {"apiBaseUrl":"/api/v1","clientHost":"http://localhost:52345","logLevel":"error"};';
    }

    location = /api/v1/status-page/resolve {
        if ($checkmate_status_range = invalid) { return 400; }
        if ($checkmate_monitor_query = invalid) { return 400; }
        if ($checkmate_incident_page = invalid) { return 400; }
        proxy_cache_key "$host:public-status:$checkmate_status_range:$checkmate_monitor_query:$checkmate_incident_page";
        proxy_pass http://127.0.0.1:52345/api/v1/status-page/appbox?type=uptime&type=infrastructure&range=$checkmate_status_range$checkmate_monitor_query&incidentPage=$checkmate_incident_page;
    }

    location = /api/v1/status-page/appbox {
        if ($checkmate_status_range = invalid) { return 400; }
        if ($checkmate_monitor_query = invalid) { return 400; }
        if ($checkmate_incident_page = invalid) { return 400; }
        proxy_cache_key "$host:public-status:$checkmate_status_range:$checkmate_monitor_query:$checkmate_incident_page";
        proxy_pass http://127.0.0.1:52345/api/v1/status-page/appbox?type=uptime&type=infrastructure&range=$checkmate_status_range$checkmate_monitor_query&incidentPage=$checkmate_incident_page;
    }

    location ^~ /assets/ {
        proxy_cache_valid 200 1h;
        proxy_pass http://127.0.0.1:52345;
    }

    location = /checkmate_favicon.svg {
        proxy_cache_valid 200 1h;
        proxy_pass http://127.0.0.1:52345;
    }

    location = /source/checkmate-appbox-source.tar.gz {
        proxy_cache off;
        proxy_pass http://127.0.0.1:52345;
    }

    location = /status/public/appbox {
        return 308 https://status.appbox.co/$is_args$args;
    }

    location / { return 404; }
}
